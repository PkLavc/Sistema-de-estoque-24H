<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>24h Locacoes - Login</title>
    <link rel="icon" type="image/webp" href="/logo.webp">
    <link rel="stylesheet" href="/css/login.css">
    <link rel="stylesheet" href="/css/theme.css">
</head>
<body>
    <div class="login-container">
        <div class="login-box">
            <div class="logo">
                <img src="/logo.webp" alt="24h Locacoes" class="logo-image">
                <p>Sistema de Controle de Estoque</p>
            </div>
            
            <form id="loginForm">
                <button type="submit" id="btn-submit">Entrar como Convidado</button>
                <div id="errorMessage" class="error-message"></div>
            </form>
            <p class="login-footer">© <span id="current-year">2026</span> <a id="perico-link" href="https://github.com/arthurperico" target="_blank" rel="noopener">Arthur Perico</a></p>
        </div>
    </div>

    <script src="/js/login.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/lottie-web/5.12.2/lottie.min.js" integrity="sha512-jEnuDt6jfecCjthQAJ+ed0MTVA++5ZKmlUcmDGBv2vUI/REn6FuIdixLNnQT+vKusE2hhTk2is3cFvv5wA+Sgg==" crossorigin="anonymous"></script>
    <script>
        document.getElementById('current-year').textContent = new Date().getFullYear();
        document.getElementById('perico-link').addEventListener('click', function(e){ /* keep style unchanged */ });
    </script>
</body>
</html>
